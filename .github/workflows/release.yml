name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/privacy-scan.mjs
        env:
          DSH_SCAN_USERNAMES: ''

  mac-arm64:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run pack:mac
      - run: npm run dmg:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dist/*.dmg

  mac-x64:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run pack:mac:x64
      - run: npm run dmg:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: dist/*.dmg

  win-x64:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run pack:win
      - run: npm run zip:win
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - run: npm run installer:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            dist/*.zip
            dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac-arm64, mac-x64, win-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          shasum -a 256 $(find . -type f | sort) > SHA256SUMS
          cd ..
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*/* artifacts/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*/* artifacts/SHA256SUMS --title "DeepSeek Harness 桌面版 $GITHUB_REF_NAME" --notes "安装包见下方 Assets。macOS 未签名需右键打开;Windows 见 SmartScreen 提示。" --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # 手动触发:把最近一次 tag 构建的产物挂到 Release(用于恢复/补传)
  release-now:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for RUN_ID in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event push --limit 5 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n mac-arm64 -n win-x64 -D artifacts >/dev/null 2>&1 && ls artifacts/mac-arm64/ >/dev/null 2>&1 && ls artifacts/win-x64/ >/dev/null 2>&1; then
              echo "已从 run $RUN_ID 下载产物"
              break
            fi
          done
          if ! ls artifacts/*/ >/dev/null 2>&1; then echo '没有可用产物'; exit 1; fi
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/tags" --jq '.[0].name')
          echo "目标 tag: $TAG"
          cd artifacts
          shasum -a 256 $(find . -type f | sort) > SHA256SUMS
          cd ..
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*/* artifacts/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/*/* artifacts/SHA256SUMS --title "DeepSeek Harness 桌面版 $TAG" --notes "安装包见下方 Assets。macOS 未签名需右键打开;Windows 见 SmartScreen 提示。" --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
